<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meeting Management System - SPA</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Main Application Container -->
    <div id="app-container"></div>

    <!-- Templates Section -->

    <!-- Template: Login Form -->
    <template id="template-login">
        <div class="login-container">
            <div class="login-form-wrapper">
                <h1>Login</h1>
                <form id="login-form" class="form">
                    <div class="form-group">
                        <label for="login-username">Username</label>
                        <input 
                            type="text" 
                            id="login-username" 
                            name="username" 
                            class="form-input" 
                            placeholder="Enter your username"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="login-password">Password</label>
                        <input 
                            type="password" 
                            id="login-password" 
                            name="password" 
                            class="form-input" 
                            placeholder="Enter your password"
                            required
                        >
                    </div>

                    <button type="submit" id="login-btn" class="btn btn-primary">Login</button>
                </form>

                <div class="form-footer">
                    <p>Don't have an account? <a href="#register" class="link">Register here</a></p>
                </div>
            </div>
        </div>
    </template>

    <!-- Template: Registration Form -->
    <template id="template-register">
        <div class="register-container">
            <div class="register-form-wrapper">
                <h1>Register</h1>
                <form id="register-form" class="form">
                    <div class="form-group">
                        <label for="register-fullname">Full Name</label>
                        <input 
                            type="text" 
                            id="register-fullname" 
                            name="full-name" 
                            class="form-input" 
                            placeholder="Enter your full name"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="register-username">Username</label>
                        <input 
                            type="text" 
                            id="register-username" 
                            name="username" 
                            class="form-input" 
                            placeholder="Choose a username"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="register-password">Password</label>
                        <input 
                            type="password" 
                            id="register-password" 
                            name="password" 
                            class="form-input" 
                            placeholder="Enter a password"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="register-confirm-password">Confirm Password</label>
                        <input 
                            type="password" 
                            id="register-confirm-password" 
                            name="confirm-password" 
                            class="form-input" 
                            placeholder="Confirm your password"
                            required
                        >
                    </div>

                    <button type="submit" id="register-btn" class="btn btn-primary">Register</button>
                </form>

                <div class="form-footer">
                    <p>Already have an account? <a href="#login" class="link">Login here</a></p>
                </div>
            </div>
        </div>
    </template>

    <!-- Template: Meetings Dashboard -->
    <template id="template-meetings">
        <div class="meetings-container">
            <div class="meetings-header">
                <h1>Meetings Dashboard</h1>
                <div class="header-actions">
                    <input 
                        type="text" 
                        id="meetings-search" 
                        class="search-input" 
                        placeholder="Search meetings by title or location..."
                    >
                    <button id="add-meeting-btn" class="btn btn-primary">+ Add New Meeting</button>
                </div>
            </div>

            <!-- Meetings List -->
            <div id="meetings-list" class="meetings-list">
                <!-- Meetings will be dynamically injected here -->
            </div>

            <!-- Add/Edit Meeting Modal -->
            <div id="meeting-modal" class="modal hidden">
                <div class="modal-content">
                    <div class="modal-header">
                        <h2 id="modal-title">Add New Meeting</h2>
                        <button id="modal-close-btn" class="btn-close">&times;</button>
                    </div>

                    <form id="meeting-form" class="form">
                        <div class="form-group">
                            <label for="meeting-title">Title</label>
                            <input 
                                type="text" 
                                id="meeting-title" 
                                name="title" 
                                class="form-input" 
                                placeholder="Enter meeting title"
                                required
                            >
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="meeting-date">Date</label>
                                <input 
                                    type="date" 
                                    id="meeting-date" 
                                    name="date" 
                                    class="form-input" 
                                    required
                                >
                            </div>

                            <div class="form-group">
                                <label for="meeting-time">Time</label>
                                <input 
                                    type="time" 
                                    id="meeting-time" 
                                    name="time" 
                                    class="form-input" 
                                    required
                                >
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="meeting-location">Location</label>
                            <input 
                                type="text" 
                                id="meeting-location" 
                                name="location" 
                                class="form-input" 
                                placeholder="Enter meeting location"
                                required
                            >
                        </div>

                        <div class="form-group">
                            <label for="meeting-description">Description</label>
                            <textarea 
                                id="meeting-description" 
                                name="description" 
                                class="form-input" 
                                placeholder="Enter meeting description"
                                rows="4"
                            ></textarea>
                        </div>

                        <div class="form-group">
                            <label for="meeting-participants">Participants (User IDs)</label>
                            <input 
                                type="text" 
                                id="meeting-participants" 
                                name="participants" 
                                class="form-input" 
                                placeholder="Enter comma-separated User IDs (e.g., 1,2,3)"
                            >
                            <small class="form-hint">Enter participant IDs separated by commas</small>
                        </div>

                        <div class="modal-actions">
                            <button type="button" id="modal-cancel-btn" class="btn btn-secondary">Cancel</button>
                            <button type="submit" id="meeting-submit-btn" class="btn btn-primary">Save Meeting</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </template>

    <!-- Root JavaScript Module -->
    <script type="module" src="js/client/app.js"></script>
</body>
</html>
